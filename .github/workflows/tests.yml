name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vetmanager
          POSTGRES_USER: vetmanager
          POSTGRES_PASSWORD: vetmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: vetmanager
      DB_USER: vetmanager
      DB_PASSWORD: vetmanager
      DB_HOST: localhost
      DB_PORT: 5432
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_PORT: '587'
      EMAIL_USE_TLS: 'True'
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci-password
      DEFAULT_FROM_EMAIL: ci@example.com
      FRONTEND_URL: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend-e2e-tests:
    runs-on: ubuntu-latest
    needs: backend-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vetmanager
          POSTGRES_USER: vetmanager
          POSTGRES_PASSWORD: vetmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: vetmanager
      DB_USER: vetmanager
      DB_PASSWORD: vetmanager
      DB_HOST: localhost
      DB_PORT: 5432
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_PORT: '587'
      EMAIL_USE_TLS: 'True'
      EMAIL_HOST_USER: ci@example.com
      EMAIL_HOST_PASSWORD: ci-password
      DEFAULT_FROM_EMAIL: ci@example.com
      FRONTEND_URL: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Start backend server
        working-directory: backend
        run: python manage.py runserver 0.0.0.0:8000 &

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm run dev
          wait-on: 'http://localhost:5173, http://localhost:8000/api/v1'
          wait-on-timeout: 60
          browser: chrome

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore